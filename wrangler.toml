# Cloudflare Workers — config minimal (jangan taruh ID palsu di sini)
# Binding KV di-set di Dashboard → Worker → Settings → Bindings
#   Variable name: ANALYTICS_KV
#   KV namespace:   dr-pinguin-analytics
#
# Env opsional (Dashboard → Variables / Secrets) untuk fallback REST:
#   CF_ACCOUNT_ID
#   CF_KV_NAMESPACE_ID   = Namespace ID dari halaman KV
#   CF_API_TOKEN         = API Token (KV Edit)
#
# Jangan commit secret. Jangan isi id = "REPLACE_..." — itu bikin build gagal.

name = "koleksi-dr-pinguinn"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Binding KV: tambahkan lewat Cloudflare Dashboard (Workers Builds),
# atau uncomment + isi Namespace ID asli setelah kamu copy dari dashboard:
#
# [[kv_namespaces]]
# binding = "ANALYTICS_KV"
# id = "PASTE_REAL_NAMESPACE_ID_HERE"
