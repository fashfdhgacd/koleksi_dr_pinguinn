# Cloudflare Workers — output dari Nitro preset cloudflare-module
name = "koleksi-dr-pinguinn"
compatibility_date = "2024-11-01"
compatibility_flags = [ "nodejs_compat" ]

# Nitro cloudflare-module menulis entry ke .output/server/index.mjs
main = ".output/server/index.mjs"

# Static assets (client build)
[assets]
directory = ".output/public"
binding = "ASSETS"

# KV analytics — uncomment + isi Namespace ID asli dari dashboard
# (Workers KV → dr-pinguin-analytics → Namespace ID)
# Atau set binding lewat Dashboard → Settings → Bindings (disarankan)
# [[kv_namespaces]]
# binding = "ANALYTICS_KV"
# id = "PASTE_REAL_NAMESPACE_ID"

# Env/secrets di Dashboard: DATABASE_URL, OWNER_SECRET, ONLINE_VIEW_SECRET, dll.
