name: strip-videy-json
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/strip-videy-json.yml"
      - "scripts/strip_videy_json.py"
permissions:
  contents: write
jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip Videy rows
        run: python3 scripts/strip_videy_json.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog/videos.json data/videos.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: hapus item Videy dari videos.json"
          git push
