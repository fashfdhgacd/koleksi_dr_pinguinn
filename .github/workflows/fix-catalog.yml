name: Fix Catalog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/lib/catalog/local.ts")
          t = p.read_text()
          # Rewrite embedan poster URLs through img-proxy
          needle = "  if (fromPoster && !PLACEHOLDER_IMAGE_RE.test(fromPoster)) {\n    return fromPoster;\n  }"
          insert = '''  if (fromPoster && !PLACEHOLDER_IMAGE_RE.test(fromPoster)) {
    // embedan tanpa proxy sering = watermark "Please watch On Original Website"
    if (/embedan\\.com/i.test(fromPoster)) {
      return `/api/img-proxy?u=${encodeURIComponent(fromPoster)}`;
    }
    return fromPoster;
  }'''
          if "img-proxy" in t:
              print("already proxy")
          elif needle in t:
              t = t.replace(needle, insert, 1)
              print("patched thumbOf")
          else:
              # try posterOk variant
              needle2 = "  if (posterOk) {\n    return fromPoster;\n  }"
              insert2 = '''  if (posterOk) {
    if (/embedan\\.com/i.test(fromPoster)) {
      return `/api/img-proxy?u=${encodeURIComponent(fromPoster)}`;
    }
    return fromPoster;
  }'''
              if needle2 in t:
                  t = t.replace(needle2, insert2, 1)
                  print("patched posterOk")
              else:
                  raise SystemExit("thumbOf poster block not found")
          p.write_text(t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog/local.ts src/routes/api/img-proxy.ts
          git commit -m "fix: embedan via img-proxy (anti watermark IndoAV)" || echo nochange
          git push
