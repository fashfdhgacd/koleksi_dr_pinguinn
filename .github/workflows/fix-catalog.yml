name: Fix Catalog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/lib/catalog/local.ts')
          t = p.read_text()
          # Restore streamtape to real tape-thumb API
          t2 = t.replace(
            'if (isStreamtape(item) && eid) return `/brand-poster.jpg`;',
            'if (isStreamtape(item) && eid) return `/api/tape-thumb?id=${encodeURIComponent(eid)}`;',
          )
          if t2 == t:
              # try already tape-thumb
              if 'tape-thumb?id=' in t:
                  print('already tape-thumb')
              else:
                  raise SystemExit('streamtape line not found')
          else:
              t = t2
              print('restored tape-thumb')
          p.write_text(t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog/local.ts
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "fix: Streamtape pakai /api/tape-thumb lagi (poster asli)"
          git push
