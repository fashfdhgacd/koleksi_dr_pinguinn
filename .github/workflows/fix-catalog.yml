name: Fix Catalog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          python3 -c "
          from pathlib import Path
          p = Path('src/lib/catalog/local.ts')
          t = p.read_text()
          a = '''  // Terbaru = katalog utama + Streamtape. JAV/Videy tetap silo sendiri.\n  const pool = items.filter((x) => !isPutarin(x) && !isVidey(x));\n  const main = sortByNewest(pool);'''
          b = '''  // Terbaru = katalog utama SAJA (IndoAV/UserBokep). Streamtape hanya di tab AI+.\n  const main = sortByNewest(mainCatalog(items));'''
          if a not in t:
              raise SystemExit('pattern not found')
          p.write_text(t.replace(a, b, 1))
          print('OK')
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog/local.ts
          git commit -m "fix(catalog): Streamtape out of Terbaru, only AI+ tab"
          git push
