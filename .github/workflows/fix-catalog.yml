name: Fix Catalog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/lib/catalog/local.ts')
          t = p.read_text()
          # final fallback empty string → brand poster
          old = '''  if (isUserBokep(item) && eid) return `/api/embed-thumb?id=${encodeURIComponent(eid)}&src=userbokep`;
  return "";'''
          new = '''  if (isUserBokep(item) && eid) return `/api/embed-thumb?id=${encodeURIComponent(eid)}&src=userbokep`;
  return `/brand-poster.jpg`;'''
          if old in t:
              t = t.replace(old, new, 1)
              print('fallback brand')
          elif 'brand-poster.jpg' in t:
              print('fallback already brand')
          else:
              # softer: any bare return "" at end of thumbOf
              import re
              m = re.search(r'(function thumbOf[\s\S]*?)(  return "";\n})', t)
              if m:
                  t = t[:m.start(2)] + '  return `/brand-poster.jpg`;\n}' + t[m.end(2):]
                  print('fallback via regex')
              else:
                  print('warn: no empty return')
          p.write_text(t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog/local.ts
          git diff --cached --quiet || git commit -m "fix: thumbOf empty → brand-poster.jpg"
          git push
