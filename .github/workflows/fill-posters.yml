# Auto poster setiap jam 00:00 WIB
name: Fill posters

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fill-posters
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fill missing/dead posters
        env:
          STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
          STREAMTAPE_KEY: ${{ secrets.STREAMTAPE_KEY }}
        run: |
          node --input-type=commonjs <<'SCRIPT'
          const fs = require("fs");
          const DEAD = /cdnhlsplayer\.lat/i;
          function embedId(embed = "") {
            const m = String(embed).match(/\/(?:e|v|d)\/([A-Za-z0-9_-]+)/i) || String(embed).match(/[?&]id=([A-Za-z0-9_-]+)/i);
            return m ? m[1] : "";
          }
          function isLivePoster(url) {
            return typeof url === "string" && url.startsWith("http") && !DEAD.test(url);
          }
          function javCoverFromTitle(title = "") {
            const m = String(title).match(/\b([A-Z]{2,8})[-_ ]?(\d{3,4})\b/i);
            if (!m) return null;
            const code = (m[1] + m[2]).toLowerCase();
            return `https://pics.dmm.co.jp/digital/video/${code}/${code}pl.jpg`;
          }
          async function fetchEmbedPoster(code, src) {
            const hosts = src === "userbokep"
              ? ["https://tv1.userbokep.com", "https://tv1.indoav.app"]
              : ["https://tv1.indoav.app", "https://tv1.userbokep.com"];
            for (const host of hosts) {
              try {
                const res = await fetch(`${host}/e/${encodeURIComponent(code)}`, {
                  headers: { accept: "text/html", "user-agent": "Mozilla/5.0 (compatible; kdp-poster/1.0)" },
                  signal: AbortSignal.timeout(8000),
                  redirect: "follow",
                });
                if (!res.ok) continue;
                const html = await res.text();
                const m =
                  html.match(/poster=["'](https?:\/\/[^"']*embedan[^"']+)["']/i) ||
                  html.match(/poster=["'](https?:\/\/[^"']+\.(?:webp|jpg|jpeg|png)[^"']*)["']/i) ||
                  html.match(/(?:property|name)=["']og:image["']\s+content=["'](https?:\/\/[^"']+)["']/i);
                const url = m?.[1]?.replace(/&/g, "&")?.trim();
                if (url?.startsWith("http") && !DEAD.test(url)) return url;
              } catch {}
            }
            return null;
          }
          async function fetchStreamtape(fileId) {
            const login = process.env.STREAMTAPE_LOGIN || "";
            const key = process.env.STREAMTAPE_KEY || "";
            if (!login || !key || !fileId) return null;
            try {
              const u = `https://api.streamtape.com/file/getsplash?login=${encodeURIComponent(login)}&key=${encodeURIComponent(key)}&file=${encodeURIComponent(fileId)}`;
              const res = await fetch(u, { signal: AbortSignal.timeout(8000) });
              const data = await res.json();
              if (data?.status === 200 && typeof data.result === "string" && data.result.startsWith("http")) return data.result;
            } catch {}
            return null;
          }
          function loadJson(p, fb) {
            try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return fb; }
          }
          (async () => {
            const postersPath = "src/lib/catalog/posters.json";
            const javPath = "src/lib/catalog/jav-posters.json";
            const latestPath = "data/latest-posters.json";
            let posters = loadJson(postersPath, {});
            if (typeof posters !== "object" || Array.isArray(posters)) posters = {};
            let javMap = loadJson(javPath, {});
            if (typeof javMap !== "object" || Array.isArray(javMap)) javMap = {};
            const videos = [
              ...loadJson("data/videos-latest.json", []),
              ...loadJson("data/putarin-latest.json", []),
              ...loadJson("src/lib/catalog/videos.json", []),
              ...loadJson("src/lib/catalog/streamtape.json", []),
              ...loadJson("src/lib/catalog/putarin.json", []),
            ];
            const seen = new Set();
            const need = [];
            for (const v of videos) {
              if (!v?.id || seen.has(v.id)) continue;
              seen.add(v.id);
              const have = posters[v.id] || javMap[v.id] || v.poster || v.thumbnail;
              if (isLivePoster(have)) continue;
              const blob = `${v.embed||""} ${v.source||""} ${v.direct||""} ${v.category||""}`;
              if (/indoav|userbokep|streamtape|putarin|puterin|\bjav\b/i.test(blob)) need.push(v);
            }
            console.log("Need posters:", need.length);
            let ok = 0, fail = 0;
            for (let i = 0; i < need.length; i++) {
              const v = need[i];
              const code = embedId(v.embed || v.direct || "") || v.id;
              const blob = `${v.embed||""} ${v.source||""} ${v.category||""}`;
              let url = null;
              if (/putarin|puterin|\bjav\b/i.test(blob)) url = javCoverFromTitle(v.title || "");
              else if (/streamtape/i.test(blob)) url = await fetchStreamtape(code);
              else if (/userbokep/i.test(blob)) url = await fetchEmbedPoster(code, "userbokep");
              else url = await fetchEmbedPoster(code, "indoav");
              if (url) {
                posters[v.id] = url;
                if (/putarin|puterin|\bjav\b/i.test(blob)) javMap[v.id] = url;
                if (code !== v.id) posters[code] = url;
                ok++;
                console.log(`OK ${v.id}`);
              } else {
                fail++;
                if (fail <= 15) console.log(`FAIL ${v.id}`);
              }
              if (!/putarin|puterin|\bjav\b/i.test(blob)) {
                await new Promise(r => setTimeout(r, 300));
              }
              if ((ok + fail) % 25 === 0) {
                fs.writeFileSync(postersPath, JSON.stringify(posters));
                fs.writeFileSync(javPath, JSON.stringify(javMap, null, 2) + "\n");
              }
            }
            fs.mkdirSync("data", { recursive: true });
            fs.writeFileSync(postersPath, JSON.stringify(posters));
            fs.writeFileSync(javPath, JSON.stringify(javMap, null, 2) + "\n");
            let latest = loadJson(latestPath, {});
            if (typeof latest !== "object" || Array.isArray(latest)) latest = {};
            for (const v of loadJson("data/videos-latest.json", [])) {
              if (!v?.id) continue;
              const url = posters[v.id];
              if (isLivePoster(url)) latest[v.id] = url;
            }
            fs.writeFileSync(latestPath, JSON.stringify(latest, null, 2) + "\n");
            console.log("Done ok=", ok, "fail=", fail, "posters=", Object.keys(posters).length, "jav=", Object.keys(javMap).length);
          })().catch(e => { console.error(e); process.exit(1); });
          SCRIPT

      - name: Owner-host posters (Byse / LuluStream / DoodStream)
        # Byse: https://img-place.com/<code>_xt.jpg (_t.jpg fallback). Lulu: https://img.lulucdn.com/<code>_xt.jpg
        # (_t.jpg fallback). Dood (playmogo): og:image of the public embed page (imgds.net/splash/...).
        # Set only when the URL answers 200 with a real jpeg/png/webp; otherwise retried next run.
        run: |
          node --input-type=commonjs <<'SCRIPT'
          const fs = require("fs");
          const latestPath = "data/latest-posters.json";
          const load = (p, fb) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return fb; } };
          const asList = (d) => (Array.isArray(d) ? d : (d && Array.isArray(d.items) ? d.items : []));
          const posters = load("src/lib/catalog/posters.json", {});
          const latest = load(latestPath, {});
          const real = (u) => typeof u === "string" && /^https?:\/\//i.test(u) && !/placeholder|brand-poster|data:image/i.test(u);
          const UA = { "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" };
          function codeOf(v) {
            const m = String(v.embed || v.direct || "").match(/\/(?:e|d|v)\/([A-Za-z0-9]+)/);
            const c = String(v.code || "") || (m ? m[1] : "") || String(v.id || "").replace(/^(?:by|lu|dd)-/, "");
            return /^[A-Za-z0-9]{6,40}$/.test(c) ? c : "";
          }
          async function isImage(url) {
            try {
              const res = await fetch(url, { headers: { ...UA, accept: "image/*" }, redirect: "follow", signal: AbortSignal.timeout(10000) });
              const type = String(res.headers.get("content-type") || "").split(";")[0].trim().toLowerCase();
              if (res.status !== 200 || !/^image\/(?:jpeg|jpg|png|webp)$/.test(type)) { await res.body?.cancel().catch(() => {}); return false; }
              return (await res.arrayBuffer()).byteLength >= 1500;
            } catch { return false; }
          }
          // Dood's embed page answers Node's fetch with 403 (bot check), curl gets the page.
          function doodOg(code) {
            try {
              const html = require("child_process").execFileSync(
                "curl",
                ["-sL", "--max-time", "10", "-A", UA["user-agent"], `https://playmogo.com/e/${code}`],
                { encoding: "utf8", maxBuffer: 4 << 20 },
              );
              const m = html.match(/(?:property|name)=["']og:image["']\s+content=["'](https?:\/\/[^"']+)["']/i);
              return m ? m[1] : "";
            } catch { return ""; }
          }
          async function candidates(kind, code) {
            if (kind === "by") return [`https://img-place.com/${code}_xt.jpg`, `https://img-place.com/${code}_t.jpg`];
            if (kind === "lu") return [`https://img.lulucdn.com/${code}_xt.jpg`, `https://img.lulucdn.com/${code}_t.jpg`];
            const og = doodOg(code);
            return og ? [og] : [];
          }
          (async () => {
            const seen = new Set();
            const need = [];
            for (const v of [...asList(load("data/drp-bokep.json", [])), ...asList(load("data/videos-latest.json", []))]) {
              const id = String(v?.id || "");
              const kind = (id.match(/^(by|lu|dd)-/) || [])[1];
              if (!kind || seen.has(id)) continue;
              seen.add(id);
              if (real(v.poster) || real(v.thumbnail) || real(posters[id]) || real(latest[id])) continue;
              const code = codeOf(v);
              if (code) need.push({ id, kind, code });
            }
            const stat = {};
            for (let i = 0; i < need.length; i += 6) {
              await Promise.all(need.slice(i, i + 6).map(async ({ id, kind, code }) => {
                stat[kind] = stat[kind] || { missing: 0, filled: 0 };
                stat[kind].missing++;
                for (const url of await candidates(kind, code)) {
                  if (await isImage(url)) { latest[id] = url; stat[kind].filled++; return; }
                }
              }));
            }
            fs.writeFileSync(latestPath, JSON.stringify(latest, null, 2) + "\n");
            console.log("Owner-host posters:", JSON.stringify(stat));
          })().catch((e) => { console.error(e); process.exit(1); });
          SCRIPT

      - name: Commit posters
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog/posters.json src/lib/catalog/jav-posters.json data/latest-posters.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No poster changes."
            exit 0
          fi
          COUNT=$(node --input-type=commonjs -e "try{console.log(Object.keys(require('./src/lib/catalog/jav-posters.json')).length)}catch(e){console.log(0)}")
          git commit -m "chore(posters): auto-fill jav+missing+owner hosts ($COUNT jav)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo "Pushed OK"
              exit 0
            fi
            sleep 3
          done
          exit 1
