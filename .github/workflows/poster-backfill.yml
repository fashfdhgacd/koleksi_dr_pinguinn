# Backfill posters/typed/<id> for catalog rows the hourly fill and daily thumb-health skipped
# (MXDrop packed poster, Vidara/g1 embed-review, dead anipop Putarin images, Dood splash).
# One batch per run, newest and mx-/dd-/g1/IndoAV/UserBokep first. Re-runnable: a poster already
# in R2 is left alone. Scheduled run stays small (30 frames). workflow_dispatch drains the backlog.
# Existing secrets only. No new Worker env, no KV.
name: Poster backfill

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      full_scan:
        description: "1 = check every catalog id, 0 = only ids with no live poster URL"
        default: "1"
      frame_cap:
        description: "Max ffmpeg frame grabs (0 = no cap, still stops at the time budget)"
        default: "0"
      budget_min:
        description: "Stop after this many minutes"
        default: "18"

permissions:
  contents: write

concurrency:
  group: poster-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: PUTARIN_API_KEY
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Backfill missing posters
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUTARIN_API_KEY: ${{ secrets.PUTARIN_API_KEY }}
          STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
          STREAMTAPE_KEY: ${{ secrets.STREAMTAPE_KEY }}
          FULL_SCAN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_scan || '0' }}
          FRAME_CAP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.frame_cap || '30' }}
          BUDGET_MIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.budget_min || '8' }}
        run: node scripts/poster-backfill.mjs

      - name: Commit stable poster URLs
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-posters.json
          if git diff --cached --quiet; then
            echo "No poster URL changes."
            exit 0
          fi
          git commit -m "chore(posters): backfill host poster URLs"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
