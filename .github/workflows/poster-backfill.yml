# Backfill posters/typed/<id> for catalog rows the hourly fill and daily thumb-health skipped
# (MXDrop packed poster, Vidara/g1 embed-review, dead anipop Putarin images, Dood splash).
# One batch per run, newest and mx-/dd-/g1/IndoAV/UserBokep first. Re-runnable: a poster already
# in R2 is left alone. The daily run stays small (30 frames). A push of this file, or
# workflow_dispatch, drains the backlog inside the time budget.
# The Cloudflare API token cannot write R2 (401). The job POSTs bytes to /thumb/<id>,
# which stores them with the Worker R2 binding. Auth is the owner key when that secret
# exists, otherwise this workflow's GitHub token (the Worker checks it can see the repo).
# No new Worker env, no KV.
name: Poster backfill

on:
  schedule:
    - cron: "30 18 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/poster-backfill.yml"
  workflow_dispatch:
    inputs:
      full_scan:
        description: "1 = check every catalog id, 0 = only ids with no live poster URL"
        default: "1"
      frame_cap:
        description: "Max ffmpeg frame grabs (0 = no cap, still stops at the time budget)"
        default: "0"
      budget_min:
        description: "Stop after this many minutes"
        default: "14"

permissions:
  contents: write

concurrency:
  group: poster-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: PUTARIN_API_KEY
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Backfill missing posters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLINE_VIEW_SECRET: ${{ secrets.ONLINE_VIEW_SECRET }}
          OWNER_SECRET: ${{ secrets.OWNER_SECRET }}
          PEMILIK_SECRET: ${{ secrets.PEMILIK_SECRET }}
          STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
          STREAMTAPE_KEY: ${{ secrets.STREAMTAPE_KEY }}
          # Daily cron stays a small batch. A push of this file, or a manual run, drains the backlog.
          FULL_SCAN: ${{ github.event_name == 'schedule' && '0' || (github.event.inputs.full_scan || '1') }}
          FRAME_CAP: ${{ github.event_name == 'schedule' && '30' || (github.event.inputs.frame_cap || '0') }}
          BUDGET_MIN: ${{ github.event_name == 'schedule' && '8' || (github.event.inputs.budget_min || '14') }}
        run: node scripts/poster-backfill.mjs

      - name: Commit stable poster URLs
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-posters.json
          if git diff --cached --quiet; then
            echo "No poster URL changes."
            exit 0
          fi
          git commit -m "chore(posters): backfill host poster URLs"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
