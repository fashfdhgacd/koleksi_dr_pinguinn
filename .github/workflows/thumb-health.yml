# Cek kesehatan thumbnail tiap hari 06:00 WIB (gratis, GitHub Actions; tanpa cron Cloudflare).
# scripts/thumb-health.mts: cek gambar kartu (R2 dulu), perbaiki lewat /thumb/<id> (Worker hapus
# salinan placeholder di R2 sendiri, lalu ambil ulang), isi poster Putarin ke data/latest-posters.json,
# tulis data/thumb-health.json. Tanpa secret/env baru. Satu commit per run, file chunk tidak disentuh.
name: Thumb health

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = cuma hitung, tanpa perbaikan/commit"
        default: "0"

permissions:
  contents: write

concurrency:
  group: thumb-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check + repair thumbnails
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: npx --yes tsx@4 --tsconfig tsconfig.json scripts/thumb-health.mts

      - name: Commit (one commit per run)
        if: ${{ (github.event.inputs.dry_run || '0') != '1' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/latest-posters.json data/thumb-health.json
          git diff --cached --quiet && exit 0
          node scripts/check-catalog.mjs
          git commit -m "chore(thumbs): daily thumb health + Putarin posters"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
