name: Catalog screenshot review
on: pull_request
permissions:
  contents: read
jobs:
  capture:
    if: github.head_ref == 'fix/catalog-thumbnail-first-paint'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        revision: [after]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'before' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix "$RUNNER_TEMP/browser" playwright@1.56.1
      - name: Capture catalog at phone and laptop sizes
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          npm run dev > "$RUNNER_TEMP/catalog-dev.log" 2>&1 &
          for n in $(seq 1 90); do curl -sS http://localhost:8080/ms -o /dev/null && break; sleep 2; done
          tail -15 "$RUNNER_TEMP/catalog-dev.log"
          mkdir -p captures
          node --input-type=commonjs <<'JS'
          const {chromium} = require(process.env.RUNNER_TEMP + '/browser/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({channel:'chrome'});
            try {
              for (const width of [390,1280]) {
                for (const path of ['/ms','/ms/kategori/hentai','/ms/kategori/jav']) {
                  const page = await browser.newPage({viewport:{width,height:width===390?844:900}});
                  await page.route(/magsrv|trafficstars|exoclick/,route=>route.abort());
                  let response;
                  for(let attempt=0; attempt<3; attempt++){
                    try {response=await page.goto('http://localhost:8080'+path,{waitUntil:'domcontentloaded',timeout:45000}); break;}
                    catch(error){if(attempt===2)throw error;await page.waitForTimeout(1000);}
                  }
                  if (!response.ok()) throw Error(path+' HTTP '+response.status());
                  const cards = page.locator('a.group:has(img.media-thumb)');
                  if(path !== '/en'){
                    await cards.first().waitFor({timeout:20000});
                    await cards.first().evaluate(el=>el.scrollIntoView({block:'start'}));
                    if (process.env.REVISION === 'after') {
                      const report=await cards.evaluateAll(els=>els.map(el=>{
                        const img=el.querySelector('img.media-thumb'), box=img.parentElement.getBoundingClientRect();
                        return {w:box.width,h:box.height,card:el.getBoundingClientRect().height,fit:getComputedStyle(img).objectFit,bg:getComputedStyle(img).backgroundImage};
                      }));
                      if(report.some(r=>r.w<=0||Math.abs(r.h-r.w*9/16)>1||r.fit!=='contain'||r.bg!=='none'||Math.abs(r.card-report[0].card)>1)) throw Error(path+' '+JSON.stringify(report));
                    }
                  }
                  await page.waitForTimeout(900);
                  await page.screenshot({path:'captures/'+path.slice(1).replaceAll('/','-')+'-'+width+'.png'});
                  if (process.env.REVISION==='after') {
                    const first=cards.first().locator('img.media-thumb');
                    const urls=await cards.locator('img.media-thumb').evaluateAll(els=>els.map(img=>img.src));
                    const targets=new Set(urls.filter(url=>!url.includes('brand-poster')));
                    for(const [w,h] of [[240,320],[480,200]]){
                      const handler=route=> (targets.has(route.request().url()) || /\/posters\/typed\/|\/thumb\//.test(route.request().url())) ? route.fulfill({contentType:'image/svg+xml',body:'<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><rect width="100%" height="100%" fill="teal"/></svg>'}) : route.continue();
                      await page.route('**/*',handler);
                      await page.reload({waitUntil:'domcontentloaded'});
                      await first.scrollIntoViewIfNeeded();
                      await page.waitForFunction(([w,h])=>[...document.querySelectorAll('a.group img.media-thumb')].some(img=>{
                        const bg=img.previousElementSibling;
                        return img.naturalWidth===w && img.naturalHeight===h && getComputedStyle(img).objectFit==='contain' && bg?.getAttribute('aria-hidden')==='true' && bg.src===img.src && getComputedStyle(bg).objectFit==='cover' && getComputedStyle(bg).filter.includes('blur') && getComputedStyle(bg).opacity==='0.6';
                      }),[w,h],{timeout:15000});
                      await page.unroute('**/*',handler);
                    }
                  }
                  await page.close();
                }
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-${{ matrix.revision }}
          path: captures/*.png
