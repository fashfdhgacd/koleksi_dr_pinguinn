name: traffic-diagnose

# Manual, read-only D1: hourly collapse timeline + population profile of DDG/Bing/direct visitors.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Diagnose
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/traffic-diagnose.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-diagnose
          path: data/traffic-diagnose.json
