name: fix-brand-images
# One-off: the old round "DR. PINGUIN" placeholder (public/brand-poster.jpg, inlined by /thumb, and
# public/og.jpg) is replaced with the pixel-art penguin cards already used for og-v2 / brand-poster-v2.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-brand-images.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy pixel penguin images
        run: |
          set -euo pipefail
          bp=$(find . -name brand-poster-v2.jpg -not -path "./node_modules/*" | head -1)
          og=$(find . -name og-v2.jpg -not -path "./node_modules/*" | head -1)
          echo "brand-poster-v2: $bp  og-v2: $og"
          if [ -z "$bp" ]; then curl -sfL -o /tmp/bp.jpg https://koleksidrpinguin.com/brand-poster-v2.jpg; bp=/tmp/bp.jpg; fi
          if [ -z "$og" ]; then curl -sfL -o /tmp/og.jpg "https://koleksidrpinguin.com/og-v2.jpg?v=14"; og=/tmp/og.jpg; fi
          file "$bp" "$og"
          cp "$bp" public/brand-poster.jpg
          cp "$og" public/og.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand-poster.jpg public/og.jpg
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "brand: pixel-art penguin placeholder and og.jpg"
          for i in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          exit 1
