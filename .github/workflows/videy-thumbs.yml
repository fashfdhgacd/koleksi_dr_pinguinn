name: videy-thumbs
# One frame per new Videy video, grabbed once with ffmpeg and saved as a static image
# (public/videy-thumbs/<id>.jpg). Cards show that file; nothing is fetched per visit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/videos-latest*.json"
      - "data/videos.json"
      - "src/lib/catalog/videos.json"
      - "scripts/videy_thumbs.py"
      - ".github/workflows/videy-thumbs.yml"
permissions:
  contents: write
concurrency:
  group: videy-thumbs
  cancel-in-progress: false
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Grab missing Videy frames
        run: python3 scripts/videy_thumbs.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/videy-thumbs || true
          if git diff --cached --quiet; then
            echo "No new thumbs"
            exit 0
          fi
          git commit -m "chore: Videy thumbnails"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
