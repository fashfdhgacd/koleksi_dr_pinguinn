# IndexNow tiap hari (07:45 WIB) + otomatis ~8 menit sesudah Daily video sync selesai.
# scripts/indexnow-sync.mjs baca sitemap LIVE, kirim cuma URL baru/berubah/hilang ke api.indexnow.org
# (Bing, Yandex, Seznam, Naver; DuckDuckGo pakai index Bing), lalu commit data/indexnow-urls.txt.
# Gratis di GitHub Actions: tanpa secret, tanpa env Worker, tanpa KV. Commit pakai [skip ci] supaya
# Workers Builds tidak build ulang (file state tidak dipakai situs).
name: IndexNow sync

on:
  schedule:
    - cron: "45 0 * * *"
  # Right after the daily upload sync, so new videos reach Bing/Yandex the same night.
  workflow_run:
    workflows: ["Daily video sync"]
    types: [completed]
  # Bot / owner uploads commit the catalog JSON; announce those new /watch pages right after deploy.
  push:
    branches: [main]
    paths:
      - "data/videos-latest*.json"
      - "data/putarin-latest*.json"
  workflow_dispatch:
    inputs:
      all:
        description: "Kirim SEMUA URL sitemap (sekali saja, mis. sesudah perubahan besar)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: indexnow-sync
  cancel-in-progress: false

jobs:
  sync:
    # workflow_run: only after a successful sync.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The sync commit triggers a Workers Builds deploy; wait for it so the live sitemap has the new videos.
      - name: Wait for the deploy of the synced data
        if: github.event_name == 'workflow_run'
        run: sleep 480

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Upload commit: poll the live sitemap (max ~8 min) until the new pages are deployed,
      # instead of a fixed sleep, so each run stays short on Actions minutes.
      - name: Wait until the upload is live
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 16); do
            node scripts/indexnow-sync.mjs --dry-run | grep -qE "baru/berubah: [1-9]" && exit 0
            sleep 30
          done
          echo "Belum ada URL baru di sitemap live; lanjut (run terjadwal akan menyusul)."

      - name: Submit new/changed URLs
        run: node scripts/indexnow-sync.mjs ${{ inputs.all && '--all' || '' }}

      - name: Commit state (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/indexnow-urls.txt
          git diff --cached --quiet && { echo "Tidak ada perubahan."; exit 0; }
          git commit -m "chore: IndexNow state ($(date -u '+%Y-%m-%d %H:%M') UTC) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
