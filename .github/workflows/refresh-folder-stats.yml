# Refresh views/duration/likes for owner's IndoAV/UserBokep folders (~every 12h).
# Rewrites src/lib/catalog/video-stats.json, then stores a daily snapshot (stats-history/) and the
# week/month deltas for the ranking pages (scripts/stats-snapshot.py). Never adds/removes videos.
name: Refresh folder stats

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-folder-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Crawl folders (slow, retries on 522)
        run: python3 scripts/refresh-folder-stats.py
      - name: Daily snapshot + week/month deltas (ranking pages)
        run: python3 scripts/stats-snapshot.py
      - name: Guard (stats + ranking snapshots only)
        run: |
          git status --porcelain --untracked-files=all | awk '{print $2}' | while read -r f; do
            case "$f" in
              src/lib/catalog/video-stats.json|src/lib/catalog/rank-periods.json|src/lib/catalog/rank-periods-meta.json|stats-history/*.json) ;;
              *) echo "unexpected change: $f"; exit 1 ;;
            esac
          done
          python3 -c "import json;d=json.load(open('src/lib/catalog/video-stats.json'));assert len(d)>1000;print(len(d))"
      - name: Commit if changed
        run: |
          git add -A src/lib/catalog/video-stats.json src/lib/catalog/rank-periods.json src/lib/catalog/rank-periods-meta.json stats-history
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "stats: refresh folder views/likes + daily ranking snapshot"
          git pull --rebase
          git push
