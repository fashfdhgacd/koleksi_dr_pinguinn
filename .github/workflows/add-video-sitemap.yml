name: Add video sitemap
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          python3 <<'PY'
          import urllib.request, re
          from pathlib import Path
          raw = urllib.request.urlopen("https://koleksidrpinguin.com/sitemap.xml", timeout=30).read().decode()
          watch = re.findall(r"https://koleksidrpinguin.com/watch/([A-Za-z0-9_-]+)", raw)[:120]
          parts = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:video="http://www.google.com/schemas/sitemap-video/1.1">',
          ]
          for id_ in watch:
            loc = f"https://koleksidrpinguin.com/watch/{id_}"
            parts += [
              "  <url>",
              f"    <loc>{loc}</loc>",
              "    <video:video>",
              "      <video:thumbnail_loc>https://koleksidrpinguin.com/og.jpg</video:thumbnail_loc>",
              f"      <video:title>Video {id_} — Dr. Pinguin</video:title>",
              "      <video:description>Nonton video bokep Indo di Dr. Pinguin. Konten 18+.</video:description>",
              f"      <video:player_loc allow_embed=\"yes\">{loc}</video:player_loc>",
              "      <video:family_friendly>no</video:family_friendly>",
              "    </video:video>",
              "  </url>",
            ]
          parts.append("</urlset>")
          Path("public/sitemap-video.xml").write_text("\n".join(parts) + "\n")
          print("urls", len(watch))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap-video.xml
          git commit -m "seo: add sitemap-video.xml for Google Search Console"
          git push
