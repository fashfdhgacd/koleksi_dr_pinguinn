# Monitor pengunjung harian per sumber, gratis di GitHub Actions (01:15 WIB, setelah hari WIB tutup).
# scripts/traffic-monitor.mjs baca D1 koleksi-analytics (SELECT saja) lewat Cloudflare REST API dan tulis
# data/traffic-daily.json (tidak di-bundle ke Worker). Tidak ada env var Worker baru, tidak ada tulis KV/D1,
# tidak ada request ke situs. Satu commit per hari, cuma kalau angkanya berubah.
# Secret opsional (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  = API token dengan izin Account > D1 > Read SAJA
#   CLOUDFLARE_ACCOUNT_ID = account id Cloudflare
# Tanpa secret: run tetap hijau, cetak ringkasan dari file + peringatan. Turun >=40% vs rata-rata 7 hari
# -> anotasi warning di run (lihat tab Summary).
name: Traffic monitor

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
  push:
    branches: [growth/traffic-monitor]
    paths: [scripts/traffic-monitor.mjs, .github/workflows/traffic-monitor.yml]

permissions:
  contents: write

concurrency:
  group: traffic-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test monitor
        run: node --test scripts/traffic-monitor.test.mjs

      - name: Read D1 + write data/traffic-daily.json
        id: monitor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/traffic-monitor.mjs

      - name: Commit (main only, only if changed)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/traffic-daily.json
          git diff --cached --quiet && { echo "Tidak ada perubahan."; exit 0; }
          git commit -m "chore: traffic monitor ($(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
