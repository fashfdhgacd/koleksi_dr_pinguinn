name: Fix Terbaru Streamtape
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/lib/catalog/local.ts")
          t = p.read_text()
          old = '''export async function listLatest(page = 1, limit = DEFAULT_PAGE_SIZE, _signal?: AbortSignal): Promise<PagedVideos> {
  const { items, posters, videyNo } = await loadItems();
  // Terbaru = katalog utama + Streamtape. JAV/Videy tetap silo sendiri.
  const pool = items.filter((x) => !isPutarin(x) && !isVidey(x));
  const main = sortByNewest(pool);
  const { slice, total, hasMore, page: p, limit: lim } = pageOf(main, page, limit);
  return { page: p, limit: lim, total, hasMore, items: slice.map((x) => toCard(x, posters, videyNo)) };
}'''
          new = '''export async function listLatest(page = 1, limit = DEFAULT_PAGE_SIZE, _signal?: AbortSignal): Promise<PagedVideos> {
  const { items, posters, videyNo } = await loadItems();
  // Terbaru = katalog utama SAJA (IndoAV/UserBokep).
  // Streamtape → tab AI+ / Streamtape; Putarin/JAV & Videy → silo sendiri.
  const main = sortByNewest(mainCatalog(items));
  const { slice, total, hasMore, page: p, limit: lim } = pageOf(main, page, limit);
  return { page: p, limit: lim, total, hasMore, items: slice.map((x) => toCard(x, posters, videyNo)) };
}'''
          if old not in t:
              raise SystemExit("listLatest block not found")
          p.write_text(t.replace(old, new, 1))
          print("OK")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog/local.ts
          git commit -m "fix(catalog): Streamtape only in AI+ tab, not Terbaru"
          git push
